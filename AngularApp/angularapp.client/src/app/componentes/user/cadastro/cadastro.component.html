<div class="row mt-4">

  <div class="col-md-6 d-none d-md-block" style="height: 450px;">
    <div class="text-center col-md-12 my-auto side-heder">
      <h1>Cadastro de Usuário</h1>
      <img src="assets\20943446.jpg" class="my-4" alt="" style="width:400px">
    </div>
  </div>

  <div class="col-md-6">

    <form [formGroup]="form" class="p-1">
      <div class="pb-2 d-block d-md-none">
        <h3 class="border-bottom">Cadastro de Usuário</h3>
      </div>
      <div class="form-row">
        <div class="form-group col-sm-6">
          <label>Primeiro Nome</label>
          <input type="text" [ngClass]="{'is-invalid': f['primeiroNome'].errors && f['primeiroNome'].touched,  'is-valid': !f['primeiroNome'].errors && f['primeiroNome'].touched }" formControlName="primeiroNome" class="form-control" placeholder="Insira o Primeiro nome" />
        </div>
        <div class="form-group col-sm-6">
          <label>Último nome</label>
          <input type="text" [ngClass]="{'is-invalid': f['ultimoNome'].errors && f['ultimoNome'].touched,  'is-valid': !f['ultimoNome'].errors && f['ultimoNome'].touched }" formControlName="ultimoNome" class="form-control" placeholder="Insira o Último nome" />
        </div>
      </div>
      <div class="form-group">
        <label for="">Email:</label>
        <input class="form-control" [ngClass]="{'is-invalid': f['email'].errors && f['email'].touched,  'is-valid': !f['email'].errors && f['email'].touched }" formControlName="email" type="text" placeholder="email@email.com" />
        <div *ngIf="f['email'].errors?.['required']" class="invalid-feedback">
          Campo Obrigatório.
        </div>
        <div *ngIf="f['email'].errors?.['email']" class="invalid-feedback">
          Digite um email válido.
        </div>
      </div>
      <div class="form-group">
        <label for="">Usuario:</label>
        <input class="form-control" [ngClass]="{'is-invalid': f['usuario'].errors && f['usuario'].touched,  'is-valid': !f['usuario'].errors && f['usuario'].touched }" formControlName="usuario" type="text" placeholder="Insira o nome de Usuário" />
      </div>
      <div class="form-row">
        <div class="form-group col-sm-6">
          <label for="">Senha:</label>
          <input [ngClass]="{'is-invalid': f['senha'].errors && f['senha'].touched,  'is-valid': !f['senha'].errors && f['senha'].touched }" formControlName="senha" class="form-control" type="password" placeholder="Digite uma Senha" />
        </div>
        <div class="form-group col-sm-6">
          <label for="">Confirmar Senha:</label>
          <input [ngClass]="{'is-invalid': f['confirmarSenha'].errors && f['confirmarSenha'].touched,  'is-valid': !f['confirmarSenha'].errors && f['confirmarSenha'].touched }" formControlName="confirmarSenha" class="form-control" type="password" placeholder="Confirme a Senha" />
        </div>
        <div *ngIf="f['confirmarSenha'].errors?.['mismatch']" class="invalid-feedback">
          As senhas não conferem.
        </div>
      </div>
      <div class="form-row p-1 mb-3">
        <div class="custom-control custom-checkbox">
          <input type="checkbox" class="custom-control-input" id="customCheck1">
          <label class="custom-control-label">Eu concordo com os <a href="#">Termos de Uso</a>.</label>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-12">
          <button class="btn btn-lg btn-success btn-block px-5">
            Registar
          </button>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-12">
          <a class="btn btn-link btn-block" routerLink="/user/login">
            Já sou Cadastrado
          </a>
        </div>
      </div>
    </form>

  </div>
</div>
